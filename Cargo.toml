[package]
name = "ios-review-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Check an iOS release and print a dated App Review packet"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-ios-review-gate"
keywords = ["ios", "app-store", "release", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", "dist/", ".factory/"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
